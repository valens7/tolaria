version: "1.0.0"

project:
  instruction: >
    Mora is a desktop knowledge-management app. Keep product names, CLI names,
    markdown wikilinks, frontmatter keys, file paths, and placeholders like
    {agent}, {zoom}, {language}, {name}, {label}, {file}, and {count} unchanged.

locales:
  source: en
  target:
    - zh-CN

files:
  json:
    include:
      - "src/lib/locales/[locale].json"
    exclude: []
    lockedKeys: []
    ignoredKeys: []
