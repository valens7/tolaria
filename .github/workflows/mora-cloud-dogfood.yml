name: Mora Cloud Dogfood Build

on:
  workflow_dispatch:
  push:
    branches:
      - cloud/mora-dogfood-ci-0906
    paths:
      - ".github/workflows/mora-cloud-dogfood.yml"

concurrency:
  group: mora-cloud-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dogfood:
    name: Build Mora dogfood (Apple Silicon)
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout handoff source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mora.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Seal app and create dogfood DMG
        run: |
          APP_BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Mora.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::Expected Mora.app was not produced at $APP_BUNDLE" >&2
            exit 1
          fi
          xattr -cr "$APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          OUT="$RUNNER_TEMP/mora-dogfood"
          mkdir -p "$OUT"
          cp -R "$APP_BUNDLE" "$OUT/Mora.app"
          ln -s /Applications "$OUT/Applications"
          DMG="Mora-dogfood-${GITHUB_SHA::7}-arm64.dmg"
          hdiutil create -volname "Mora Dogfood" -srcfolder "$OUT" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload Mora dogfood DMG
        uses: actions/upload-artifact@v4
        with:
          name: mora-dogfood-${{ github.sha }}-arm64
          path: ${{ env.DMG }}
          retention-days: 7
          if-no-files-found: error
